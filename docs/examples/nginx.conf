# Redacted example: nginx reverse proxy for OpenSearch + Dashboards
# Real domain replaced with opensearch.example.com. TLS uses self-signed
# certs here — swap for real certificates (e.g. Let's Encrypt) in production.
server {
    listen 80;
    listen [::]:80;
    server_name opensearch.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name opensearch.example.com;

    ssl_certificate /etc/ssl/certs/opensearch.example.com-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/opensearch.example.com-selfsigned.key;

    # OpenSearch REST API -> https://127.0.0.1:9201 (compose republishes 9200 as 9201)
    location /api/ {
        proxy_pass https://127.0.0.1:9201/;  # strips the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OpenSearch uses demo self-signed certs
        proxy_ssl_verify off;

        # large NDJSON bulk payloads
        client_max_body_size 100M;
        proxy_request_buffering off;
        proxy_buffering off;

        # long-running searches
        proxy_read_timeout 300s;
    }

    # OpenSearch Dashboards (basePath /dashboards set in opensearch_dashboards.yml)
    location /dashboards/ {
        proxy_pass http://127.0.0.1:5602/dashboards/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Important: Tell your app that it's behind HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    location = / {
        return 302 /dashboards/;
    }

    access_log /var/log/nginx/opensearch.example.com.access.log;
    error_log /var/log/nginx/opensearch.example.com.error.log;
}
